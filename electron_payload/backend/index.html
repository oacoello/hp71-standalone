<script>

// ================== 🔥 NUEVA LÓGICA ==================
let ud_mode = false
let pieces = []
let sendingCommand = false

// La pieza base real viene del flujo COB_BASE del backend.
// JavaScript usa índice 0, por eso PIECE 1 = index 0, PIECE 2 = index 1, etc.
let basePieceNumber = 1
let basePieceIndex = 0
let currentPiece = basePieceIndex
let waitingBasePieceValue = false

function clampPieceIndex(index){
    if(pieces.length === 0) return Math.max(0, index)
    if(index < 0) return 0
    if(index >= pieces.length) return pieces.length - 1
    return index
}

function setBasePiece(num){
    let n = parseInt(num, 10)
    if(isNaN(n) || n < 1) return

    basePieceNumber = n
    basePieceIndex = n - 1
    currentPiece = clampPieceIndex(basePieceIndex)
}

function updateBasePieceFromText(text){
    let raw = String(text || "")

    // Detecta estos formatos:
    // BASE PIECE 3
    // BASE PIECE: 3
    // BASE PIECE (P *): 3
    let match = raw.match(/BASE\s+PIECE(?:\s*\([^)]*\))?\s*:?\s*(\d+)/i)
    if(match){
        setBasePiece(match[1])
        waitingBasePieceValue = true
        return
    }

    // Si ya salimos del prompt de BASE PIECE, dejamos de esperar ese valor.
    if(!raw.toUpperCase().includes("BASE PIECE")){
        waitingBasePieceValue = false
    }
}

function captureBasePieceBeforeSend(cmd){
    let clean = String(cmd || "").trim()

    // Si la pantalla estaba pidiendo BASE PIECE y el usuario escribe un número,
    // esa es la pieza base real que se debe mostrar después del tiro.
    if(waitingBasePieceValue && /^\d+$/.test(clean)){
        setBasePiece(clean)
        waitingBasePieceValue = false
    }
}

function parsePieces(text){

pieces = []
let parts = text.split("----- PIECE")

if(parts.length <= 1) return false

for(let i=1;i<parts.length;i++){
    let p = "----- PIECE" + parts[i]
    p = p.trim()

    let match = p.match(/-----\s+PIECE\s+(\d+)\s+-----/i)
    let pieceNumber = match ? parseInt(match[1], 10) : i
    let isBasePiece = (pieceNumber === basePieceNumber)

    // quitar COMP CORR de no-base
    if(!isBasePiece){
        p = p.replace(/COMP CORR[\s\S]*/,"").trim()
        p += "\n\nTESON DR EVIL"
    }

    // base elegida por el usuario
    if(isBasePiece){
        if(!p.includes("COMP CORR")){
            p += "\n\nCOMP CORR (Y N P *)"
        }
        if(!p.includes("TESON DR EVIL")){
            p += "\nTESON DR EVIL"
        }
    }

    pieces.push(p)
}

currentPiece = clampPieceIndex(basePieceIndex)
return true
}

function getBasePiece(){
    if(pieces.length === 0) return null
    return pieces[clampPieceIndex(basePieceIndex)]
}

function showPiece(){
if(pieces.length === 0) return prompt
return pieces[clampPieceIndex(currentPiece)]
}
// ================== FIN NUEVA LÓGICA ==================


let buffer=""
let prompt="SANTA BARBARA"

function updateScreen(){

let text = showPiece()

if(buffer.length>0){
    text += " " + buffer
}

document.getElementById("lcdtext").innerText = text
}

function send(cmd){

if(sendingCommand) return
sendingCommand = true

captureBasePieceBeforeSend(cmd)
logEvent("INPUT", cmd.length ? "USUARIO: " + cmd : "USUARIO: ENTER")

fetch("/input",{
method:"POST",
headers:{ "Content-Type":"application/x-www-form-urlencoded" },
body:"cmd="+encodeURIComponent(cmd)
})
.then(r=>r.text())
.then(t=>{

    updateBasePieceFromText(t)
    updateRecordFromResponse(cmd, t)

    if(t.trim() === "INITIALIZE"){
    prompt = "INITIALIZE"
    buffer = ""
    pieces = []
    updateScreen()

    setTimeout(()=>{
        fetch("/input",{
            method:"POST",
            headers:{ "Content-Type":"application/x-www-form-urlencoded" },
            body:"cmd="+encodeURIComponent("")
        })
        .then(r=>r.text())
        .then(next=>{
            updateBasePieceFromText(next)
            prompt = next
            buffer = ""
            pieces = []
            updateScreen()
        })
        .finally(()=>{
            sendingCommand = false
        })
    }, 2000)

    return
}

// Procesar piezas
if(parsePieces(t)){

    let raw = t.toUpperCase()

    // SOLO activar cuando el sistema realmente solicita entrada
    if(raw.trim() === "U/D" || raw.includes("ENTER U/D")){
        ud_mode = true
    }

    // SALIR DE MODO U/D SOLO CUANDO REGRESA A COMP CORR
    if(raw.includes("COMP CORR")){
        ud_mode = false
    }

    // SEGURIDAD: SI VUELVE A PDA
    if(raw.includes("FUZE PDA")){
        ud_mode = false
    }

    let basePiece = getBasePiece()

    // LIMPIAR CUALQUIER ARRASTRE DE TIA/HOB EN NUEVO TGT
    if(raw.includes("FUZE PDA") && basePiece){
        pieces[clampPieceIndex(basePieceIndex)] = basePiece.replace(/FUZE\s+TIA\s+HOB\s+\d+/g, "FUZE PDA")
    }

    // LIMPIAR SIEMPRE PRIMERO EN LA BASE ELEGIDA
    basePiece = getBasePiece()
    if(basePiece){
        pieces[clampPieceIndex(basePieceIndex)] = basePiece.replace(/\n\nU\/D \?/g, "")
    }

    // APLICAR SOLO SI ESTÁ ACTIVO EN LA BASE ELEGIDA
    basePiece = getBasePiece()
    if(ud_mode && basePiece){
        pieces[clampPieceIndex(basePieceIndex)] = basePiece + "\n\nU/D ?"
    }

}else{
    prompt = t
}

buffer=""
updateScreen()

})
.catch(e=>{
    prompt = "ERROR"
    buffer = ""
    updateScreen()
})
.finally(()=>{
    if(prompt !== "INITIALIZE"){
        sendingCommand = false
    }
})

}

document.querySelectorAll("button").forEach(btn=>{

btn.addEventListener("click",()=>{

let key = btn.getAttribute("data")
if(!key) return

if(sendingCommand && key !== "UP" && key !== "DOWN"){
    return
}

// 🔥 NAVEGACIÓN PIEZAS
if(key==="UP"){
    logEvent("INPUT", "USUARIO: ▲")
    if(pieces.length>0){
        currentPiece--
        if(currentPiece<0) currentPiece = pieces.length-1
        updateScreen()
    }
    return
}

if(key==="DOWN"){
    logEvent("INPUT", "USUARIO: ▼")
    if(pieces.length>0){
        currentPiece++
        if(currentPiece>=pieces.length) currentPiece = 0
        updateScreen()
    }
    return
}

// 🔥 FORZAR BASE REAL EN P, Y Y N
if(key==="P" || key==="Y" || key==="N"){
    currentPiece = clampPieceIndex(basePieceIndex)
}

// RUN
if(key==="RUN"){
buffer = "RUNBUCS"
updateScreen()
return
}

// ENTER / ENDLINE
if(key==="ENTER"){
    let value = buffer.trim()
    buffer = ""

    if(value.length === 0){
        send("")
    }else{
        send(value)
    }

    return
}

if(key==="BACK"){
buffer = buffer.slice(0,-1)
updateScreen()
return
}

buffer += key
updateScreen()

})

})

updateScreen()

</script>

<script>

// teclado físico igual
document.addEventListener("keydown", function(event){

let key = event.key

// Las ventanas abiertas (record / historial) capturan el teclado
if(isOverlayOpen()){
    if(key === "Escape") closeOverlays()
    return
}

if(key==="ArrowUp"){
    logEvent("INPUT", "USUARIO: ▲")
    if(pieces.length>0){
        currentPiece--
        if(currentPiece<0) currentPiece = pieces.length-1
        updateScreen()
    }
    return
}

if(key==="ArrowDown"){
    logEvent("INPUT", "USUARIO: ▼")
    if(pieces.length>0){
        currentPiece++
        if(currentPiece>=pieces.length) currentPiece = 0
        updateScreen()
    }
    return
}

if(key === "Enter"){
    let value = buffer.trim()
    buffer = ""

    if(value.length === 0){
        send("")
    }else{
        send(value)
    }

    updateScreen()
    return
}

if(key === "Backspace"){
    buffer = buffer.slice(0,-1)
    updateScreen()
    event.preventDefault()
    return
}

if(!isNaN(key)){
    buffer += key
    updateScreen()
    return
}

if(key.length === 1 && /[a-zA-Z]/.test(key)){
    buffer += key.toUpperCase()
    updateScreen()
    return
}

if(key === " "){
    buffer += " "
    updateScreen()
    return
}

if(["+", "-", "*", "/", ".", ",", "(", ")"].includes(key)){
    buffer += key
    updateScreen()
    return
}

})

</script>

<script>
// ============================================================
// VENTANAS: RECORD DE TIRO + HISTORIAL DE INPUTS
// Backend: endpoints /record y /log en hp71_server/main.cpp
// Actualizacion en vivo: BroadcastChannel("hp71-record")
// ============================================================

var recordData = {}
var recordRows = []
var recordInputField = null
// Filas verdes = correcciones: solo se crean despues de responder N o Y en
// el menu COMP CORR. Se arma en updateRecordFromResponse y se resetea con ON.
var recordGreenArmed = false
// Ultima respuesta del motor = prompt que el usuario tenia en pantalla.
var recordLastResponse = ""
var recordChannel = null
try{ if("BroadcastChannel" in window) recordChannel = new BroadcastChannel("hp71-record") }catch(e){}

var logSessionId = "session-" + new Date().toISOString().replace(/[:.]/g, "-")
var currentLogLines = []
var historyOpen = false
var viewingSession = logSessionId

// ---------- Utilidades de parseo (portadas de cdt-santabarbara) ----------
var PIECE_HEADER_PATTERN = /^[\s\-–—]*PIECE\s+(\d+)[\s\-–—]*$/i
var RECORD_ROW_KEYS = ["dir", "lr", "ad", "ud", "targetNumber", "pieceNumber", "distance", "charge", "tof", "deflection", "qe"]

function cleanNumber(value){
    if(!value || /NO\s+DATA/i.test(value)) return undefined
    var parsed = Number(value)
    return isFinite(parsed) ? parsed : undefined
}

function definedRecordPatch(patch){
    var out = {}
    Object.keys(patch).forEach(function(k){ if(patch[k] !== undefined) out[k] = patch[k] })
    return out
}

function splitPiecesRaw(text){
    var lines = String(text || "").split(/\r?\n/)
    var result = []
    var current = []
    var currentNumber = null

    for(var i = 0; i < lines.length; i++){
        var clean = lines[i].trim()
        var match = clean.match(PIECE_HEADER_PATTERN)

        if(match){
            if(current.length > 0 && currentNumber !== null)
                result.push({ number: currentNumber, text: current.join("\n") })
            currentNumber = parseInt(match[1], 10)
            current = [clean]
            continue
        }

        if(current.length > 0){
            if(clean.indexOf("COMP CORR") === 0 || clean.indexOf("TESON") === 0) continue
            if(clean !== "") current.push(clean)
        }
    }

    if(current.length > 0 && currentNumber !== null)
        result.push({ number: currentNumber, text: current.join("\n") })

    return result
}

function parseRecordFromDisplay(text, fallbackPiece){
    var pieces = splitPiecesRaw(text)
    var piece = null

    for(var i = 0; i < pieces.length; i++){
        if(pieces[i].number === fallbackPiece){ piece = pieces[i]; break }
    }
    if(!piece && pieces.length > 0) piece = pieces[0]

    var source = piece ? piece.text : String(text || "")

    return {
        pieceNumber: piece ? piece.number : undefined,
        distance: cleanNumber((source.match(/\bDIST\s+([^\s]+)/i) || [])[1]),
        deflection: cleanNumber((source.match(/\bDEF\s+([^\s]+)/i) || [])[1]),
        // carga 155mm viene con sufijo (6W, 3G...): se conserva el token; si es solo numero, va a numero
        charge: (function(t){
            if(!t) return undefined
            if(/^\d+[A-Za-z]?$/.test(t)) return /[A-Za-z]/.test(t) ? t.toUpperCase() : Number(t)
            return cleanNumber(t)
        })((source.match(/\bCHG\s+([^\s]+)/i) || [])[1]),
        qe: cleanNumber((source.match(/\bQE\s+([^\s]+)/i) || [])[1]),
        tof: cleanNumber((source.match(/\bTOF\s+([^\s]+)/i) || [])[1]),
        // Coordenadas del blanco (bloque "TGT DATA: EAST:/NORTH:/ALT:" del flujo REG)
        targetEast: cleanNumber((text.match(/\bEAST:\s*(-?\d+(?:\.\d+)?)/i) || [])[1]),
        targetNorth: cleanNumber((text.match(/\bNORTH:\s*(-?\d+(?:\.\d+)?)/i) || [])[1]),
        targetAlt: cleanNumber((text.match(/\bALT:\s*(-?\d+(?:\.\d+)?)/i) || [])[1]),
        // Indicador del blanco ("TGT AA1000 / KNPT 1 STORED" al guardarlo)
        targetName: (function(t){
            // permite espacios en el indicador (ej. "AA 1000")
            var m = String(t || "").match(/\bTGT\s+(.+?)\s*\/\s*KNPT/i)
            return m ? m[1].trim() : undefined
        })(text),
        angleT: cleanNumber((text.match(/\bANG\s+T(?:\s+\(P\*\):)?\s*([^\s]+)/i) || [])[1]),
        observerDirection: cleanNumber((text.match(/\bDIR(?:\s+\(P\s+X\):)?\s*([^\s]+)/i) || [])[1]),
        correctionLR: cleanNumber((text.match(/\bLR\s+SHIFT\s+([^\s]+)/i) || [])[1]),
        correctionAD: cleanNumber((text.match(/\bAD\s+SHIFT\s+([^\s]+)/i) || [])[1]),
        correctionUD: cleanNumber((text.match(/\bUD\s+SHIFT\s+([^\s]+)/i) || [])[1])
    }
}

function parsePieceRecordRow(piece, context){
    var parsed = parseRecordFromDisplay(piece.text, piece.number)
    var row = definedRecordPatch({
        targetNumber: context.targetNumber,
        pieceNumber: parsed.pieceNumber !== undefined ? parsed.pieceNumber : piece.number,
        distance: parsed.distance,
        charge: parsed.charge,
        tof: parsed.tof,
        deflection: parsed.deflection,
        qe: parsed.qe
    })

    if(row.pieceNumber === undefined && row.distance === undefined && row.charge === undefined &&
       row.tof === undefined && row.deflection === undefined && row.qe === undefined)
        return null

    row.id = Date.now() + "-" + piece.number + "-" + Math.random().toString(36).slice(2, 7)
    return row
}

function currentTargetFromDisplay(text){
    var match = String(text || "").match(/\b(?:KNPT|BLANCO|TGT)\s*(?:\(P\s+\*\))?\s*:?\s*(\d+)/i)
    return match ? cleanNumber(match[1]) : undefined
}

function parseDirectionalNumber(value, positiveLetters, negativeLetters){
    var clean = String(value).trim().toUpperCase()
    if(!clean) return undefined

    var direction = clean.charAt(0)
    var numeric = Number((positiveLetters + negativeLetters).indexOf(direction) >= 0 ? clean.slice(1) : clean)
    if(!isFinite(numeric)) return undefined

    return negativeLetters.indexOf(direction) >= 0 ? -numeric : numeric
}

function getRecordInputField(text){
    // Menu 3 (TGT) del MAIN: los prompts muestran el valor viejo; el dato real
    // es lo que el usuario teclea a continuacion.
    if(/^\s*TGT:\s*$/i.test(text)) return "targetName"
    if(/TGT\s+\(P\s*\*\):/i.test(text)) return "targetName"
    if(/TGT\s+E\s+\(P\s*\*\)/i.test(text)) return "targetEast"
    if(/TGT\s+N\s+\(P\s*\*\)/i.test(text)) return "targetNorth"
    if(/TGT\s+ALT\s+\(P\s*\*\)/i.test(text)) return "targetAlt"
    if(/DIR\s+\(P\s+X\):/i.test(text)) return "observerDirection"
    if(/\(L\/R\)\s+SHIFT/i.test(text)) return "correctionLR"
    if(/\(A\/D\)\s+SHIFT/i.test(text)) return "correctionAD"
    if(/\(U\/D\)\s+SHIFT/i.test(text)) return "correctionUD"
    // Ruta Y de COMP CORR: TIME REG pide la correccion como (U/D) CORR (*)
    if(/\(U\/D\)\s+CORR/i.test(text)) return "correctionUD"
    return null
}

function sameRecordRow(a, b){
    for(var i = 0; i < RECORD_ROW_KEYS.length; i++){
        var k = RECORD_ROW_KEYS[i]
        var av = a[k] === undefined ? null : a[k]
        var bv = b[k] === undefined ? null : b[k]
        if(av !== bv) return false
    }
    return true
}

function addRecordRowsFromResponse(text){
    // Gate verde: sin N/Y previo en COMP CORR no se crea ninguna fila.
    if(!recordGreenArmed) return

    var rawPieces = splitPiecesRaw(text)
    if(rawPieces.length === 0) return

    // UNA SOLA FILA POR RONDA: la pieza que la pantalla muestra como calculo
    // (la base, ver parsePieces -> currentPiece = basePieceIndex), la misma
    // que alimenta los campos azules (parseRecordFromDisplay usa este criterio).
    var target = null
    for(var i = 0; i < rawPieces.length; i++){
        if(rawPieces[i].number === basePieceNumber){ target = rawPieces[i]; break }
    }
    if(!target) target = rawPieces[0]

    var row = parsePieceRecordRow(target, recordData)
    if(!row) return

    // Correcciones vigentes al disparar: se pintan en la fila verde
    row.dir = recordData.observerDirection
    row.lr  = recordData.correctionLR
    row.ad  = recordData.correctionAD
    row.ud  = recordData.correctionUD

    // Evita duplicados cuando P/Y/N reemiten la misma solucion
    var last = recordRows[recordRows.length - 1]
    if(last && sameRecordRow(last, row)) return

    recordRows.push(row)

    if(recordRows.length > 7) recordRows = recordRows.slice(-7)
}

// Se ejecuta con cada respuesta de la calculadora
function updateRecordFromResponse(cmd, text){
    if(cmd === "ON"){
        recordData = {}
        recordRows = []
        recordInputField = null
        recordGreenArmed = false
        recordLastResponse = ""
        pushRecord()
        renderRecord()
        return
    }

    var cleanCmd = String(cmd || "").trim()

    // Arma el verde: N o Y contestados con el menu COMP CORR visible
    // (recordLastResponse todavia guarda el prompt anterior a esta respuesta).
    var upperCmd = cleanCmd.toUpperCase()
    if((upperCmd === "N" || upperCmd === "Y") &&
       recordLastResponse.indexOf("COMP CORR") >= 0){
        recordGreenArmed = true
        // Nueva ronda de correcciones: la fila verde registra SOLO lo corregido
        // en esta ronda (no se arrastran L/R, A/D ni U/D de la anterior).
        // El motor sigue acumulando su solucion internamente (eso no cambia).
        delete recordData.correctionLR
        delete recordData.correctionAD
        delete recordData.correctionUD
    }

    var pendingField = (cleanCmd !== "P" && cleanCmd !== "*") ? recordInputField : null
    var patch = {}

    if(pendingField && cleanCmd){
        if(pendingField === "observerDirection"){
            var vDir = Number(cleanCmd)
            if(isFinite(vDir)) patch.observerDirection = vDir
        } else if(pendingField === "correctionLR"){
            var vLr = parseDirectionalNumber(cleanCmd, "R", "L")
            if(vLr !== undefined) patch.correctionLR = vLr
        } else if(pendingField === "correctionAD"){
            var vAd = parseDirectionalNumber(cleanCmd, "A", "D")
            if(vAd !== undefined) patch.correctionAD = vAd
        } else if(pendingField === "correctionUD"){
            // "X" en (U/D) CORR cancela (no cambia la correccion)
            var vUd = cleanCmd !== "X" ? parseDirectionalNumber(cleanCmd, "U", "D") : undefined
            if(vUd !== undefined) patch.correctionUD = vUd
        } else if(pendingField === "targetName"){
            patch.targetName = cleanCmd
        } else if(pendingField === "targetEast"){
            var vTe = Number(cleanCmd)
            if(isFinite(vTe)) patch.targetEast = vTe
        } else if(pendingField === "targetNorth"){
            var vTn = Number(cleanCmd)
            if(isFinite(vTn)) patch.targetNorth = vTn
        } else if(pendingField === "targetAlt"){
            var vTa = Number(cleanCmd)
            if(isFinite(vTa)) patch.targetAlt = vTa
        }
    }

    var parsed = parseRecordFromDisplay(text, basePieceNumber)
    var target = currentTargetFromDisplay(text)

    // Azules = primer calculo (antes de correcciones): se congelan en la
    // primera vez que tienen valor y ya no se sobreescriben (hasta ON).
    var frozenBlueKeys = ["distance", "charge", "deflection", "qe"]
    frozenBlueKeys.forEach(function(k){
        if(recordData[k] !== undefined) delete parsed[k]
    })

    recordData = Object.assign({}, recordData,
        target !== undefined ? { targetNumber: target } : {},
        definedRecordPatch(parsed),
        patch)

    recordInputField = getRecordInputField(text)

    addRecordRowsFromResponse(text)

    // Esta respuesta pasa a ser el "prompt anterior" para la proxima entrada
    recordLastResponse = String(text || "")

    pushRecord()
    renderRecord()
}

function pushRecord(){
    try{
        var payload = JSON.stringify({ data: recordData, rows: recordRows })
        fetch("/record", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload
        }).catch(function(){})
        if(recordChannel) recordChannel.postMessage({ type: "record" })
    }catch(e){}
}

// Compone la hoja del record tal cual se ve (formulario + textos + valores)
// y la devuelve como dataURL PNG listo para descargar en el PC.
function buildRecordPng(){
    return new Promise(function(resolve, reject){
        var sheet = document.querySelector(".record-sheet")
        var sr = sheet.getBoundingClientRect()
        var idoc = sheet.querySelector("iframe").contentDocument
        if(!idoc || idoc.readyState !== "complete" || sr.width === 0){
            reject(new Error("Hoja no lista"))
            return
        }

        var W = Math.round(sr.width)
        var H = Math.round(sr.height)
        var scale = 2 // retina para que el texto se vea nitido

        // 1) Serializar el iframe del formulario (imagen + textos + estilos embebidos)
        var html = new XMLSerializer().serializeToString(idoc.documentElement)
        html = html.replace(/^<\?xml[^>]*\?>/, "")
        // Los scripts no corren dentro de la imagen y solo ensucian
        html = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "")
        // Estilos que rompen el render en foreignObject (fit-content / 100vw + scale)
        html = html.replace(/<style id="solo-documento-sin-fondo">[\s\S]*?<\/style>/i, "")
        html = html.replace(/<style id="cdt-record-fit">[\s\S]*?<\/style>/i, "")
        // La hoja se serializa a su tamano natural (792x612, sin transform) y el
        // escalado al lienzo lo hace drawImage: transform:scale() > 1 dentro de
        // foreignObject rompe el render en Chromium (sale todo en blanco).
        var fixCss =
            "html,body{margin:0!important;padding:0!important;background:#fff!important;width:100%!important;height:100%!important;overflow:hidden!important}" +
            "#sidebar,.loading-indicator{display:none!important}"
        html = html.replace(/<head([^>]*)>/i, "<head$1><style>" + fixCss + "</style>")

        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612">' +
                  '<foreignObject width="792" height="612">' + html + '</foreignObject></svg>'
        var formUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg)

        var formImg = new Image()
        formImg.onload = function(){
            var c = document.createElement("canvas")
            c.width = W * scale
            c.height = H * scale
            var ctx = c.getContext("2d")
            ctx.scale(scale, scale)
            ctx.fillStyle = "#ffffff"
            ctx.fillRect(0, 0, W, H)

            // 2) Formulario (rejilla + textos tal como se pintan en pantalla)
            ctx.drawImage(formImg, 0, 0, W, H)

            // 3) Valores encima (azules y verdes)
            var spans = document.querySelectorAll("#recordValues .rv, #recordValues .rv-row")
            Array.prototype.forEach.call(spans, function(sp){
                var text = (sp.textContent || "").trim()
                if(!text) return
                var r = sp.getBoundingClientRect()
                var cs = getComputedStyle(sp)
                var italic = cs.fontStyle === "italic" ? "italic " : ""
                ctx.font = italic + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily
                ctx.fillStyle = cs.color
                ctx.textBaseline = "middle"
                var align = cs.textAlign === "center" || cs.textAlign === "" ? "center" : (cs.textAlign === "right" ? "right" : "left")
                ctx.textAlign = align
                var x = r.left - sr.left
                if(align === "center") x += r.width / 2
                else if(align === "right") x += r.width
                ctx.fillText(text, x, r.top - sr.top + r.height / 2)
            })

            resolve(c.toDataURL("image/png"))
        }
        formImg.onerror = function(){ reject(new Error("No se pudo componer la hoja")) }
        formImg.src = formUrl
    })
}

// Guardar = descargar la hoja del record tal cual se ve, como PNG en el PC
function saveRecord(){
    var btn = document.getElementById("recordSave")
    if(!btn) return

    buildRecordPng().then(function(dataUrl){
        var a = document.createElement("a")
        a.href = dataUrl
        a.download = "record-de-tiro-" + localTimestamp().replace(/[: ]/g, "-") + ".png"
        document.body.appendChild(a)
        a.click()
        a.remove()

        // copia en el servidor tambien (para restaurar tras recargar/reiniciar)
        pushRecord()

        btn.textContent = "Guardado \u2713"
        btn.classList.add("saved")
        setTimeout(function(){ btn.textContent = "Guardar"; btn.classList.remove("saved") }, 2500)
    }).catch(function(){
        btn.textContent = "Error al guardar"
        setTimeout(function(){ btn.textContent = "Guardar" }, 2500)
    })
}

// ---------- Pintado de la hoja ----------
// ALCANCE/LOT.C/DF.Disp/Q.E = primer calculo (antes de correcciones, ver
// updateRecordFromResponse). PZA# = pieza base. ANG T va en la casilla del
// simbolo + T (junto a MENSAJE AL OBSERVADOR).
// tops = linea de la etiqueta impresa de cada celda (valores "en linea" y
// sin cruzar el borde inferior): fila PZA/ALCANCE cy310 -> 25.14%,
// fila C/TI/DF/QE cy336 -> 28.59% (center = 120.7 + top% * 7.53)
var RECORD_FIELDS = [
    { key: "targetNumber",       left: "53.3%", top: "6.4%",  width: "10%",
      // "Blanco": indicador TGT (ej. AA1000) si existe; si no, el KNPT
      value: function(){ return recordData.targetName || recordData.targetNumber } },
    { key: "pieceNumber",        left: "33%",   top: "25.14%", width: "4.5%", value: function(){ return basePieceNumber } },
    { key: "distance",           left: "52%",   top: "25.14%", width: "9%" },
    { key: "charge",             left: "39.2%", top: "28.59%", width: "3.8%" },
    { key: "tof",                left: "65.2%", top: "28.59%", width: "6.2%" },
    { key: "deflection",         left: "76.5%", top: "28.59%", width: "7.5%" },
    { key: "qe",                 left: "84%",   top: "28.59%", width: "6.5%" },
    { key: "angleT",             left: "32.18%", top: "31.5%", width: "7.5%" },
    // COORDENADAS del blanco (TGT): E / N / ALT. Vienen del bloque
    // "TGT DATA: EAST:/NORTH:/ALT:" (REG) o de los prompts del menu 3.
    { key: "targetCoords",       left: "25.8%",  top: "8.8%",  width: "24%",
      value: function(){
          var e = recordData.targetEast
          var n = recordData.targetNorth
          var a = recordData.targetAlt
          if(e === undefined && n === undefined && a === undefined) return ""
          var fmt = function(v){ return v === undefined || v === null ? "" : String(Math.round(v * 10) / 10) }
          var out = "E " + fmt(e) + "   N " + fmt(n)
          if(a !== undefined) out += "   ALT " + fmt(a)
          return out
      } }
]

// Fila verde: correcciones (DIR/L-R/A-D/U-D con letra) + resultados del calculo
// Centros de celda medidos sobre la hoja: AZ 4.8-11.0, DESV 11.0-15.5,
// ALC 15.5-19.9, ALT ESP 19.9-23.8, MA.G 23.8-33.3, TI 37.8-41.6,
// DEF.DISP 52.2-59.0, QE 78.1-83.4
var RECORD_ROW_FIELDS = [
    { key: "dir",          left: "7.9%",    width: "6.3%", fmt: fmtDirPlain },
    { key: "lr",           left: "13.25%",  width: "4.5%", fmt: function(v){ return fmtDir(v, "R", "L") } },
    { key: "ad",           left: "17.73%",  width: "5.7%", fmt: function(v){ return fmtDir(v, "A", "D") } },
    { key: "ud",           left: "21.85%",  width: "4.8%", fmt: function(v){ return fmtDir(v, "U", "D") } },
    { key: "charge",       left: "28.58%",  width: "3.6%", fmt: fmtRecord },
    { key: "tof",          left: "40%",     width: "5.3%", fmt: fmtRecord },
    { key: "deflection",   left: "55.59%",  width: "6.2%", fmt: fmtRecord },
    { key: "qe",           left: "80.79%",  width: "5.6%", fmt: fmtRecord }
]

function fmtRecord(value){
    if(value === undefined || value === null || value === 0) return ""
    // carga con sufijo alfabetico ("6W", "3G") se muestra tal cual
    if(typeof value === "string") return value
    return String(Math.round(value * 10) / 10)
}

// Correcciones con letra en vez de signo: -200 -> L200, -50 -> D50, 10 -> U10
function fmtDir(value, positiveLetter, negativeLetter){
    if(!value) return ""
    var n = Math.round(value * 10) / 10
    return (n < 0 ? negativeLetter : positiveLetter) + Math.abs(n)
}

function fmtDirPlain(value){
    if(!value) return ""
    return String(Math.round(value * 10) / 10)
}

function escapeHtml(value){
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
}

function renderRecord(){
    var box = document.getElementById("recordValues")
    if(!box) return

    var html = ""

    RECORD_FIELDS.forEach(function(f){
        var val = fmtRecord(f.value ? f.value() : recordData[f.key])
        html += '<span class="rv" style="left:' + f.left + ";top:" + f.top + ";width:" + f.width +
                '" title="' + escapeHtml(val) + '">' + escapeHtml(val) + "</span>"
    })

    recordRows.slice(0, 7).forEach(function(row, rowIndex){
        // 42.14% = centro de la 1a fila verde (cy438); paso 2.252% ~ 17px
        var top = (42.14 + rowIndex * 2.252) + "%"
        RECORD_ROW_FIELDS.forEach(function(f){
            var val = (f.fmt || fmtRecord)(row[f.key])
            html += '<span class="rv-row" style="left:' + f.left + ";top:" + top + ";width:" + f.width +
                    '" title="' + escapeHtml(val) + '">' + escapeHtml(val) + "</span>"
        })
    })

    box.innerHTML = html
}

// ---------- Historial de INPUTs ----------
function pad2(n){ return (n < 10 ? "0" : "") + n }

function localTimestamp(){
    var d = new Date()
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
           " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds())
}

function logEvent(type, content){
    try{
        var body = "type=" + encodeURIComponent(type) +
                   "&content=" + encodeURIComponent(content) +
                   "&sessionId=" + encodeURIComponent(logSessionId)

        fetch("/log", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body
        }).catch(function(){})

        if(type === "INPUT"){
            var line = "[" + localTimestamp() + "] INPUT: " + content
            currentLogLines.push(line)
            if(historyOpen && viewingSession === logSessionId) appendHistoryLine(line)
        }
    }catch(e){}
}

function appendHistoryLine(line){
    var pre = document.getElementById("historyContent")
    if(!pre || pre.getAttribute("data-session") !== logSessionId) return
    pre.textContent += (pre.textContent ? "\n" : "") + line
    pre.scrollTop = pre.scrollHeight
}

function renderSessionsList(logs){
    var box = document.getElementById("historySessions")
    if(!box) return

    if(!logs || logs.length === 0){
        box.innerHTML = '<div class="history-empty">Todavía no hay logs para este perfil.</div>'
        return
    }

    var html = ""

    logs.forEach(function(log){
        var isCurrent = log.id === logSessionId
        var active = log.id === viewingSession ? " active" : ""
        var last = (log.preview && log.preview.length) ? log.preview[log.preview.length - 1] : ""

        html += '<div class="hsession' + active + '" data-id="' + escapeHtml(log.id) + '">' +
                    '<div class="sid">' + escapeHtml(log.id) +
                        (isCurrent ? ' <span class="tag">(actual)</span>' : "") +
                    "</div>" +
                    '<div class="smeta">' + escapeHtml(log.updatedAt || "") + " · " + log.entries + " entradas</div>" +
                    '<div class="sprev">' + escapeHtml(last) + "</div>" +
                "</div>"
    })

    box.innerHTML = html

    Array.prototype.forEach.call(box.querySelectorAll(".hsession"), function(el){
        el.addEventListener("click", function(){
            viewingSession = el.getAttribute("data-id")

            Array.prototype.forEach.call(box.querySelectorAll(".hsession"), function(other){
                other.classList.toggle("active", other.getAttribute("data-id") === viewingSession)
            })

            loadSessionContent(viewingSession)
        })
    })
}

function refreshHistoryList(){
    fetch("/log", { cache: "no-store" })
        .then(function(r){ return r.json() })
        .then(function(j){ renderSessionsList((j && j.logs) || []) })
        .catch(function(){
            var box = document.getElementById("historySessions")
            if(box) box.innerHTML = '<div class="history-empty">No se pudo leer el historial.</div>'
        })
}

function loadSessionContent(id){
    var pre = document.getElementById("historyContent")
    if(!pre) return

    pre.textContent = "Cargando..."
    pre.setAttribute("data-session", id)

    fetch("/log?session=" + encodeURIComponent(id), { cache: "no-store" })
        .then(function(r){ return r.text() })
        .then(function(txt){
            pre.textContent = txt || "(sin entradas)"
            if(id === logSessionId) currentLogLines = txt ? txt.split(/\r?\n/).filter(Boolean) : []
            pre.scrollTop = pre.scrollHeight
        })
        .catch(function(){ pre.textContent = "No se pudo cargar la sesión." })
}

// ---------- Apertura / cierre de ventanas ----------
function isOverlayOpen(){
    return document.getElementById("recordOverlay").classList.contains("open") ||
           document.getElementById("historyOverlay").classList.contains("open")
}

function closeOverlays(){
    document.getElementById("recordOverlay").classList.remove("open")
    document.getElementById("historyOverlay").classList.remove("open")
    historyOpen = false
}

function restoreRecordFromServer(){
    fetch("/record", { cache: "no-store" })
        .then(function(r){ return r.json() })
        .then(function(j){
            if(!j || !j.data) return
            if(Object.keys(recordData).length === 0) recordData = j.data
            if(recordRows.length === 0 && Array.isArray(j.rows)) recordRows = j.rows
            renderRecord()
        })
        .catch(function(){})
}

function openRecord(){
    closeOverlays()
    document.getElementById("recordOverlay").classList.add("open")
    restoreRecordFromServer()
    renderRecord()
}

function openHistory(){
    closeOverlays()
    historyOpen = true
    viewingSession = logSessionId
    document.getElementById("historyOverlay").classList.add("open")
    refreshHistoryList()
    loadSessionContent(logSessionId)
}

// ---------- Conexiones ----------
document.getElementById("btnRecord").addEventListener("click", openRecord)
document.getElementById("btnHistory").addEventListener("click", openHistory)
document.getElementById("recordClose").addEventListener("click", closeOverlays)
document.getElementById("recordSave").addEventListener("click", saveRecord)
document.getElementById("historyClose").addEventListener("click", closeOverlays)
document.getElementById("historyRefresh").addEventListener("click", function(){
    refreshHistoryList()
    loadSessionContent(viewingSession)
})
